<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>仿QQ音乐播放器</title>
    <!-- 引入 Vue3 和 Axios -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background: #1e1e1e;
            color: #fff;
            font-family: 'Microsoft YaHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .player {
            width: 920px;
            max-width: 100%;
            background: #2c2c2c;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            position: relative;
        }
        .player-main {
            display: flex;
            gap: 30px;
        }
        /* 左侧封面与控制区 */
        .left-panel {
            width: 330px;
            flex-shrink: 0;
            text-align: center;
            border-right: 1px solid #444;
            padding-right: 30px;
        }
        .cover-container {
            width: 240px;
            height: 240px;
            margin: 0 auto;
            border-radius: 50%;
            background: #111;
            padding: 10px;
            box-shadow: 0 0 20px rgba(49, 194, 124, 0.2);
        }
        .cover {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            animation: spin 15s linear infinite;
            animation-play-state: paused;
        }
        .cover.playing {
            animation-play-state: running;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        .song-info { margin-top: 20px; }
        .song-title { font-size: 22px; color: #31c27c; font-weight: bold; margin-bottom: 5px; }
        .song-artist { color: #aaa; font-size: 16px; }

        /* 播放控制区 */
        .player-controls { margin-top: 18px; }
        .progress-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .time {
            font-size: 12px;
            color: #aaa;
            min-width: 36px;
            text-align: center;
        }
        .progress-bar {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            border-radius: 3px;
            background: #444;
            outline: none;
            cursor: pointer;
        }
        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #31c27c;
            cursor: pointer;
        }
        .progress-bar::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #31c27c;
            cursor: pointer;
            border: none;
        }
        .control-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 14px;
        }
        .play-btn {
            padding: 9px 24px;
        }

        /* 右侧多视图区 */
        .right-panel {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            max-height: 430px;
        }
        .nav-tabs {
            display: flex;
            gap: 10px;
            border-bottom: 1px solid #444;
            padding-bottom: 12px;
            margin-bottom: 12px;
        }
        .tab-btn {
            padding: 8px 16px;
            border-radius: 20px;
            background: #383838;
            color: #ccc;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn:hover {
            background: #464646;
            color: #fff;
        }
        .tab-btn.active {
            background: #31c27c;
            color: #fff;
            font-weight: bold;
        }
        .tab-btn.fav-tab.active {
            background: #ff5c5c;
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .panel-header h2 {
            margin: 0;
            font-size: 16px;
            color: #ddd;
        }
        .refresh-btn {
            padding: 4px 12px;
            font-size: 12px;
            background: #3d3d3d;
            color: #ccc;
            border-radius: 14px;
        }
        .refresh-btn:hover {
            background: #4e4e4e;
            color: #fff;
        }
        .list-scroll {
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
        }
        .empty-state {
            color: #888;
            text-align: center;
            margin-top: 60px;
            font-size: 14px;
        }
        .song-item {
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            background: #333;
        }
        .song-item:hover {
            background: #3d3d3d;
        }
        .song-item.active {
            background: #31c27c;
            color: #fff;
        }
        .song-item-info {
            min-width: 0;
            flex: 1;
        }
        .song-item-title {
            font-size: 15px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .song-item-meta {
            font-size: 12px;
            opacity: 0.78;
            margin-top: 3px;
        }
        .item-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .mini-btn {
            padding: 5px 12px;
            font-size: 12px;
            border-radius: 16px;
            border: none;
            color: #fff;
            cursor: pointer;
            transition: 0.2s;
        }
        .mini-btn.play {
            background: #31c27c;
        }
        .mini-btn.play:hover {
            background: #28a76a;
        }
        .song-item.active .mini-btn.play {
            background: rgba(0, 0, 0, 0.25);
        }
        .mini-btn.danger {
            background: #ff5c5c;
        }
        .mini-btn.danger:hover {
            background: #e04848;
        }

        /* 评论区 */
        .comment-section {
            margin-top: 24px;
            border-top: 1px solid #444;
            padding-top: 16px;
        }
        .comment-input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .comment-input-row input {
            flex: 1;
            padding: 9px 12px;
            border-radius: 8px;
            border: 1px solid #4a4a4a;
            background: #222;
            color: #fff;
            outline: none;
        }
        .comment-input-row input:focus {
            border-color: #31c27c;
        }
        .comment-item {
            margin-bottom: 10px;
            font-size: 14px;
            background: #333;
            padding: 8px 12px;
            border-radius: 8px;
        }

        button {
            padding: 10px 25px;
            background: #31c27c;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.25s;
        }
        button:hover { background: #28a76a; }

        /* 顶部轻提示 */
        .toast {
            position: fixed;
            top: 24px;
            right: 24px;
            background: rgba(49, 194, 124, 0.95);
            color: #fff;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 14px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            z-index: 999;
        }
        .toast.error {
            background: rgba(255, 92, 92, 0.95);
        }
    </style>
</head>
<body>
<div id="app" class="player">
    <div v-if="toastMsg" class="toast" :class="{ error: toastType === 'error' }">
        {{ toastMsg }}
    </div>

    <div class="player-main">
        <!-- 左侧播放区 -->
        <div class="left-panel">
            <div class="cover-container">
                <img :src="currentSong.coverUrl || 'https://p1.music.126.net/6y-UleORITEDbvrOLV0Q8A==/5639395138885805.jpg'"
                     class="cover" :class="{playing: isPlaying}">
            </div>
            <div class="song-info">
                <div class="song-title">{{ currentSong.songName || '请选择歌曲' }}</div>
                <div class="song-artist">{{ currentSong.artistName || '未知歌手' }}</div>
            </div>

            <!-- 播放控制：进度条 + 播放/暂停 + 收藏/取消收藏 -->
            <div class="player-controls">
                <div class="progress-row">
                    <span class="time">{{ formatTime(currentTime) }}</span>
                    <input type="range" class="progress-bar" min="0" :max="duration" step="0.1"
                           :value="currentTime" @input="seek">
                    <span class="time">{{ formatTime(duration) }}</span>
                </div>
                <div class="control-actions">
                    <button class="play-btn" @click="togglePlay">
                        {{ isPlaying ? '⏸ 暂停' : '▶ 播放' }}
                    </button>
                    <button class="play-btn"
                            :style="{ background: isCurrentFavorited ? '#666' : '#ff5c5c' }"
                            @click="toggleFavorite">
                        {{ isCurrentFavorited ? '💔 取消收藏' : '❤ 收藏' }}
                    </button>
                </div>
            </div>
        </div>

        <!-- 右侧多界面切换区：歌单 / 收藏歌曲 / 播放记录 -->
        <div class="right-panel">
            <div class="nav-tabs">
                <button class="tab-btn"
                        :class="{ active: activeTab === 'playlist' }"
                        @click="switchTab('playlist')">
                    🎵 推荐歌单 ({{ songList.length }})
                </button>
                <button class="tab-btn fav-tab"
                        :class="{ active: activeTab === 'favorites' }"
                        @click="switchTab('favorites')">
                    ❤ 收藏歌曲 ({{ favoriteList.length }})
                </button>
                <button class="tab-btn"
                        :class="{ active: activeTab === 'history' }"
                        @click="switchTab('history')">
                    🕒 播放记录 ({{ historyList.length }})
                </button>
            </div>

            <!-- 1. 推荐歌单界面 -->
            <template v-if="activeTab === 'playlist'">
                <div class="panel-header">
                    <h2>🎵 我的最爱歌单</h2>
                </div>
                <div class="list-scroll">
                    <div v-if="songList.length === 0" class="empty-state">
                        正在加载数据或暂无歌曲...
                    </div>
                    <div v-for="song in songList" :key="song.songId"
                         class="song-item" :class="{ active: currentSong.songId === song.songId }"
                         @click="playSong(song)">
                        <div class="song-item-info">
                            <div class="song-item-title">{{ song.songName }}</div>
                            <div class="song-item-meta">{{ song.artistName }}</div>
                        </div>
                        <div class="item-actions">
                            <button class="mini-btn play" @click.stop="playSong(song)">▶ 播放</button>
                        </div>
                    </div>
                </div>
            </template>

            <!-- 2. 收藏歌曲界面 -->
            <template v-else-if="activeTab === 'favorites'">
                <div class="panel-header">
                    <h2>❤ 我的收藏歌曲</h2>
                    <button class="refresh-btn" @click="fetchFavorites">刷新</button>
                </div>
                <div class="list-scroll">
                    <div v-if="favoriteList.length === 0" class="empty-state">
                        暂无收藏歌曲，点击左侧“❤ 收藏”添加吧~
                    </div>
                    <div v-for="song in favoriteList" :key="song.songId"
                         class="song-item" :class="{ active: currentSong.songId === song.songId }"
                         @click="playSong(song)">
                        <div class="song-item-info">
                            <div class="song-item-title">{{ song.songName }}</div>
                            <div class="song-item-meta">
                                {{ song.artistName }}
                                <span v-if="song.favTime"> · 收藏于 {{ formatDateTime(song.favTime) }}</span>
                            </div>
                        </div>
                        <div class="item-actions">
                            <button class="mini-btn play" @click.stop="playSong(song)">▶ 播放</button>
                            <button class="mini-btn danger" @click.stop="removeFavorite(song.songId)">取消收藏</button>
                        </div>
                    </div>
                </div>
            </template>

            <!-- 3. 播放记录界面 -->
            <template v-else-if="activeTab === 'history'">
                <div class="panel-header">
                    <h2>🕒 最近播放记录</h2>
                    <button class="refresh-btn" @click="fetchHistory">刷新</button>
                </div>
                <div class="list-scroll">
                    <div v-if="historyList.length === 0" class="empty-state">
                        暂无播放记录，播放歌曲后会自动记录到这里~
                    </div>
                    <div v-for="(item, index) in historyList"
                         :key="item.historyId ? 'h-' + item.historyId : 'h-' + item.songId + '-' + index"
                         class="song-item" :class="{ active: currentSong.songId === item.songId }"
                         @click="playSong(item)">
                        <div class="song-item-info">
                            <div class="song-item-title">{{ item.songName }}</div>
                            <div class="song-item-meta">
                                {{ item.artistName }}
                                <span v-if="item.playTime"> · 播放于 {{ formatDateTime(item.playTime) }}</span>
                            </div>
                        </div>
                        <div class="item-actions">
                            <button class="mini-btn play" @click.stop="playSong(item)">▶ 播放</button>
                            <button class="mini-btn danger" @click.stop="removeHistory(item)">删除</button>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- 评论区 -->
    <div class="comment-section" v-if="currentSong.songId">
        <h3 style="font-size: 16px; margin-top: 0;">💬 评论区 - {{ currentSong.songName }}</h3>

        <div class="comment-input-row">
            <input v-model="newComment" placeholder="说点什么吧..." @keyup.enter="submitComment">
            <button @click="submitComment" style="padding: 8px 18px;">发送</button>
        </div>

        <div v-if="comments.length === 0" style="color: #888; font-size: 13px;">暂无评论，快来抢沙发~</div>
        <div v-for="(c, index) in comments" :key="index" class="comment-item">
            <span style="color: #31c27c; font-weight: bold;">{{ c.username }}: </span>
            <span>{{ c.content }}</span>
            <div style="font-size: 12px; color: #888; margin-top: 4px;">{{ formatDateTime(c.create_time) }}</div>
        </div>
    </div>

    <!-- 隐藏的audio标签 -->
    <audio ref="audioPlayer" @ended="nextSong"
           @timeupdate="onTimeUpdate" @loadedmetadata="onLoadedMetadata"
           @play="onPlay" @pause="onPause"></audio>
</div>

<script>
    const { createApp, ref, computed, onMounted, nextTick } = Vue;

    createApp({
        setup() {
            const USER_ID = 1;

            const activeTab = ref('playlist'); // 'playlist' | 'favorites' | 'history'
            const songList = ref([]);
            const favoriteList = ref([]);
            const historyList = ref([]);
            const currentSong = ref({});
            const isPlaying = ref(false);
            const audioPlayer = ref(null);
            const currentTime = ref(0);
            const duration = ref(0);

            // 轻提示状态
            const toastMsg = ref('');
            const toastType = ref('success');
            let toastTimer = null;
            const showToast = (msg, type = 'success') => {
                toastMsg.value = msg;
                toastType.value = type;
                if (toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toastMsg.value = '';
                }, 2200);
            };

            // 评论区状态
            const comments = ref([]);
            const newComment = ref('');

            // 当前歌曲是否已收藏
            const isCurrentFavorited = computed(() => {
                if (!currentSong.value.songId) return false;
                return favoriteList.value.some(f => f.songId === currentSong.value.songId);
            });

            // 标记“下一次 play 事件需要写入播放历史”（暂停后继续播放不重复写入；每次点击播放歌曲会重置为 true）
            let pendingHistoryRecord = true;

            const fetchComments = (songId) => {
                if (!songId) { comments.value = []; return; }
                axios.get(`/api/comment/${songId}`)
                    .then(res => { comments.value = res.data; })
                    .catch(err => console.error("获取评论失败:", err));
            };

            const fetchFavorites = () => {
                return axios.get(`/api/favorite/${USER_ID}`)
                    .then(res => { favoriteList.value = res.data || []; })
                    .catch(err => console.error("获取收藏列表失败:", err));
            };

            const fetchHistory = () => {
                return axios.get(`/api/history/${USER_ID}`)
                    .then(res => { historyList.value = res.data || []; })
                    .catch(err => console.error("获取播放记录失败:", err));
            };

            const switchTab = (tab) => {
                activeTab.value = tab;
                if (tab === 'favorites') {
                    fetchFavorites();
                } else if (tab === 'history') {
                    fetchHistory();
                }
            };

            const submitComment = () => {
                if (!newComment.value.trim()) return;
                const data = {
                    songId: currentSong.value.songId,
                    userId: USER_ID,
                    content: newComment.value
                };
                axios.post('/api/comment/add', data).then(res => {
                    showToast(res.data.msg || '评论成功！');
                    newComment.value = '';
                    fetchComments(currentSong.value.songId);
                }).catch(err => {
                    console.error("评论失败:", err);
                    showToast('评论失败', 'error');
                });
            };

            // 秒 -> mm:ss
            const formatTime = (seconds) => {
                if (!seconds || isNaN(seconds)) return '00:00';
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60);
                return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
            };

            // 时间格式化
            const formatDateTime = (val) => {
                if (!val) return '';
                const d = new Date(val);
                if (isNaN(d.getTime())) return String(val).replace('T', ' ').slice(0, 19);
                const pad = n => String(n).padStart(2, '0');
                return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
            };

            // 写入播放历史并刷新播放记录列表
            const recordPlayHistory = (songId) => {
                if (!songId) return Promise.resolve();
                return axios.post('/api/history/add', { userId: USER_ID, songId })
                    .then(() => fetchHistory())
                    .catch(err => console.error("记录播放历史失败:", err));
            };

            // 播放 / 暂停
            const togglePlay = () => {
                const audio = audioPlayer.value;
                if (!currentSong.value.songId || !audio) return;
                if (audio.paused) {
                    if (!audio.src) {
                        audio.src = currentSong.value.audioUrl;
                        pendingHistoryRecord = true;
                    }
                    audio.play().catch(e => console.log("播放失败", e));
                } else {
                    audio.pause();
                }
            };

            // 收藏当前歌曲
            const addFavorite = (songId = currentSong.value.songId) => {
                if (!songId) { showToast("请先选择一首歌", "error"); return; }
                axios.post('/api/favorite/add', { userId: USER_ID, songId })
                    .then(res => {
                        showToast(res.data.msg || '收藏成功！');
                        fetchFavorites();
                    })
                    .catch(err => {
                        console.error("收藏失败:", err);
                        showToast("收藏失败", "error");
                    });
            };

            // 取消收藏（从数据库 t_favorite 删除并刷新收藏列表）
            const removeFavorite = (songId) => {
                if (!songId) return;
                axios.post('/api/favorite/remove', { userId: USER_ID, songId })
                    .then(res => {
                        showToast(res.data.msg || '已取消收藏');
                        fetchFavorites();
                    })
                    .catch(err => {
                        console.error("取消收藏失败:", err);
                        showToast("取消收藏失败", "error");
                    });
            };

            const toggleFavorite = () => {
                if (!currentSong.value.songId) {
                    showToast("请先选择一首歌", "error");
                    return;
                }
                if (isCurrentFavorited.value) {
                    removeFavorite(currentSong.value.songId);
                } else {
                    addFavorite(currentSong.value.songId);
                }
            };

            // 删除单条播放记录（从数据库 t_play_history 删除并刷新播放记录列表）
            const removeHistory = (record) => {
                if (!record) return;
                axios.post('/api/history/remove', {
                    userId: USER_ID,
                    historyId: record.historyId ?? null,
                    songId: record.songId,
                    playTime: record.playTime ?? null
                }).then(res => {
                    showToast(res.data.msg || '已删除播放记录', res.data.code === 200 ? 'success' : 'error');
                    fetchHistory();
                }).catch(err => {
                    console.error("删除播放记录失败:", err);
                    showToast("删除播放记录失败", "error");
                });
            };

            // 进度条
            const onTimeUpdate = () => {
                if (audioPlayer.value) currentTime.value = audioPlayer.value.currentTime;
            };
            const onLoadedMetadata = () => {
                if (audioPlayer.value) duration.value = audioPlayer.value.duration || 0;
            };
            const seek = (event) => {
                const time = Number(event.target.value);
                if (audioPlayer.value) {
                    audioPlayer.value.currentTime = time;
                    currentTime.value = time;
                }
            };

            const onPlay = () => {
                isPlaying.value = true;
                const songId = currentSong.value.songId;
                if (songId && pendingHistoryRecord) {
                    pendingHistoryRecord = false;
                    recordPlayHistory(songId);
                }
            };
            const onPause = () => { isPlaying.value = false; };

            // 页面加载时请求歌单、收藏列表、播放记录
            onMounted(() => {
                axios.get('/api/playlist/1')
                    .then(res => {
                        songList.value = res.data || [];
                        if (songList.value.length > 0) {
                            currentSong.value = songList.value[0];
                            fetchComments(currentSong.value.songId);
                        }
                    })
                    .catch(err => {
                        console.error("请求后端失败:", err);
                        alert("获取数据失败，请检查后端是否启动以及数据库配置！");
                    });
                fetchFavorites();
                fetchHistory();
            });

            // 点击某首歌播放（无论是从歌单、收藏还是历史点击，都会播放并更新播放记录）
            const playSong = (song) => {
                if (!song || !song.songId) return;
                currentSong.value = song;
                fetchComments(song.songId);
                pendingHistoryRecord = true;
                nextTick(() => {
                    const audio = audioPlayer.value;
                    if (!audio) return;
                    audio.src = song.audioUrl;
                    audio.currentTime = 0;
                    audio.play().catch(e => console.log("播放被拦截或链接失效", e));
                });
            };

            // 自动下一首
            const nextSong = () => {
                const list = activeTab.value === 'favorites' && favoriteList.value.length > 0
                    ? favoriteList.value
                    : songList.value;
                if (list.length > 0) {
                    let currentIndex = list.findIndex(s => s.songId === currentSong.value.songId);
                    let nextIndex = currentIndex >= 0 ? (currentIndex + 1) % list.length : 0;
                    playSong(list[nextIndex]);
                }
            };

            return {
                activeTab, switchTab,
                songList, favoriteList, historyList,
                currentSong, isPlaying, isCurrentFavorited, audioPlayer,
                currentTime, duration, toastMsg, toastType,
                comments, newComment, fetchComments, submitComment,
                fetchFavorites, fetchHistory,
                formatTime, formatDateTime, togglePlay, seek,
                onTimeUpdate, onLoadedMetadata, onPlay, onPause,
                playSong, nextSong, addFavorite, removeFavorite, toggleFavorite, removeHistory
            };
        }
    }).mount('#app');
</script>
</body>
</html>
