<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>仿QQ音乐播放器</title>
    <!-- 引入 Vue3 和 Axios -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <style>
        body {
            background: #1e1e1e;
            color: #fff;
            font-family: 'Microsoft YaHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .player {
            width: 850px;
            background: #2c2c2c;
            border-radius: 20px;
            display: flex;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            position: relative;
        }
        /* 左侧封面 */
        .left-panel {
            width: 350px;
            text-align: center;
            border-right: 1px solid #444;
            padding-right: 30px;
        }
        .cover-container {
            width: 250px;
            height: 250px;
            margin: 0 auto;
            border-radius: 50%;
            background: #111; /* 模拟黑胶唱片底色 */
            padding: 10px;
            box-shadow: 0 0 20px rgba(49, 194, 124, 0.2);
        }
        .cover {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            animation: spin 15s linear infinite;
            animation-play-state: paused;
        }
        .cover.playing {
            animation-play-state: running;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        .song-info { margin-top: 20px; }
        .song-title { font-size: 22px; color: #31c27c; font-weight: bold; margin-bottom: 5px;}
        .song-artist { color: #aaa; font-size: 16px;}

        /* 播放控制区（进度条 + 播放/暂停） */
        .player-controls { margin-top: 18px; }
        .progress-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .time {
            font-size: 12px;
            color: #aaa;
            min-width: 36px;
            text-align: center;
        }
        .progress-bar {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            border-radius: 3px;
            background: #444;
            outline: none;
            cursor: pointer;
        }
        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #31c27c;
            cursor: pointer;
        }
        .progress-bar::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #31c27c;
            cursor: pointer;
            border: none;
        }
        .play-btn {
            margin-top: 12px;
            padding: 9px 32px;
        }

        /* 右侧歌单 */
        .right-panel {
            flex: 1;
            padding-left: 30px;
            max-height: 400px;
            overflow-y: auto;
        }
        .right-panel h2 { margin-top: 0; font-size: 18px; color: #ddd; border-bottom: 1px solid #444; padding-bottom: 10px;}
        .song-item {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 5px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: space-between;
        }
        .song-item:hover {
            background: #3a3a3a;
        }
        .song-item.active {
            background: #31c27c;
            color: #fff;
            font-weight: bold;
        }
        .song-item .artist { font-size: 12px; opacity: 0.8; }

        button {
            padding: 10px 25px;
            background: #31c27c;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background: #28a76a; }
    </style>
</head>
<body>
<div id="app" class="player">
    <!-- 左侧播放区 -->
    <div class="left-panel">
        <div class="cover-container">
            <img :src="currentSong.coverUrl || 'https://p1.music.126.net/6y-UleORITEDbvrOLV0Q8A==/5639395138885805.jpg'"
                 class="cover" :class="{playing: isPlaying}">
        </div>
        <div class="song-info">
            <div class="song-title">{{ currentSong.songName || '请选择歌曲' }}</div>
            <div class="song-artist">{{ currentSong.artistName || '未知歌手' }}</div>
        </div>

        <!-- 播放控制：进度条 + 播放/暂停 + 收藏按钮 -->
        <div class="player-controls">
            <div class="progress-row">
                <span class="time">{{ formatTime(currentTime) }}</span>
                <input type="range" class="progress-bar" min="0" :max="duration" step="0.1"
                       :value="currentTime" @input="seek">
                <span class="time">{{ formatTime(duration) }}</span>
            </div>
            <div style="display:flex; gap:12px; justify-content:center; margin-top:12px;">
                <button class="play-btn" style="margin-top:0;" @click="togglePlay">
                    {{ isPlaying ? '⏸ 暂停' : '▶ 播放' }}
                </button>
                <button class="play-btn" style="margin-top:0; background:#ff5c5c;" @click="addFavorite">
                    ❤ 收藏
                </button>
            </div>
        </div>
    </div>

    <!-- 右侧歌单区 -->
    <div class="right-panel">
        <h2>🎵 我的最爱歌单</h2>
        <div v-if="songList.length === 0" style="color: #888; text-align: center; margin-top: 50px;">
            正在加载数据或暂无歌曲...
        </div>
        <div v-for="song in songList" :key="song.songId"
             class="song-item" :class="{active: currentSong.songId === song.songId}"
             @click="playSong(song)">
            <span>{{ song.songName }}</span>
            <span class="artist">{{ song.artistName }}</span>
        </div>
    </div>

    <!-- 评论区 -->
    <div class="comment-section" v-if="currentSong.songId" style="margin-top: 20px; border-top: 1px solid #444; padding-top: 10px;">
        <h3 style="font-size: 16px;">💬 评论区</h3>

        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <input v-model="newComment" placeholder="说点什么吧..." style="flex: 1; padding: 8px; border-radius: 5px; border: none;">
            <button @click="submitComment" style="padding: 5px 15px;">发送</button>
        </div>

        <div v-for="(c, index) in comments" :key="index" style="margin-bottom: 10px; font-size: 14px;">
            <span style="color: #31c27c;">{{ c.username }}: </span>
            <span>{{ c.content }}</span>
            <div style="font-size: 12px; color: #888;">{{ c.create_time }}</div>
        </div>
    </div>

    <!-- 隐藏的audio标签 -->
    <audio ref="audioPlayer" @ended="nextSong"
           @timeupdate="onTimeUpdate" @loadedmetadata="onLoadedMetadata"
           @play="onPlay" @pause="onPause"></audio>
</div>

<script>
    const { createApp, ref, onMounted, nextTick } = Vue;

    createApp({
        setup() {
            const songList = ref([]);
            const currentSong = ref({});
            const isPlaying = ref(false);
            const audioPlayer = ref(null);
            const currentTime = ref(0);   // 当前播放进度（秒）
            const duration = ref(0);      // 歌曲总时长（秒）

            // ===== 评论区状态 =====
            const comments = ref([]);
            const newComment = ref('');

            // 获取某首歌的评论
            const fetchComments = (songId) => {
                if (!songId) { comments.value = []; return; }
                axios.get(`/api/comment/${songId}`)
                    .then(res => { comments.value = res.data; })
                    .catch(err => console.error("获取评论失败:", err));
            };

            // 提交评论（后端现在返回 {code, msg}）
            const submitComment = () => {
                if (!newComment.value.trim()) return;
                const data = {
                    songId: currentSong.value.songId,
                    userId: 1,
                    content: newComment.value
                };
                axios.post('/api/comment/add', data).then(res => {
                    alert(res.data.msg);
                    newComment.value = '';
                    fetchComments(currentSong.value.songId);
                });
            };

            // 秒 -> mm:ss
            const formatTime = (seconds) => {
                if (!seconds || isNaN(seconds)) return '00:00';
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60);
                return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
            };

            // ===== 播放 / 暂停 =====
            const togglePlay = () => {
                const audio = audioPlayer.value;
                if (!currentSong.value.songId || !audio) return;
                if (audio.paused) {
                    // 第一次点播放时还没有音频源，先补上
                    if (!audio.src) audio.src = currentSong.value.audioUrl;
                    audio.play().catch(e => console.log("播放失败", e));
                } else {
                    audio.pause();
                }
            };

            // ===== 收藏当前歌曲 =====
            const addFavorite = () => {
                if (!currentSong.value.songId) { alert("请先选择一首歌"); return; }
                axios.post('/api/favorite/add', { userId: 1, songId: currentSong.value.songId })
                    .then(res => alert(res.data.msg))
                    .catch(err => console.error("收藏失败:", err));
            };

            // ===== 进度条 =====
            const onTimeUpdate = () => {
                if (audioPlayer.value) currentTime.value = audioPlayer.value.currentTime;
            };
            const onLoadedMetadata = () => {
                if (audioPlayer.value) duration.value = audioPlayer.value.duration || 0;
            };
            const seek = (event) => {
                const time = Number(event.target.value);
                if (audioPlayer.value) {
                    audioPlayer.value.currentTime = time;
                    currentTime.value = time;
                }
            };
            // 用原生 play/pause 事件同步状态，保证暂停/自动切歌时按钮和封面动画都正确
            // 记录播放历史：同一首歌只记一次（暂停后继续播不算新一次）
            let lastRecordedSongId = null;
            const onPlay = () => {
                isPlaying.value = true;
                const songId = currentSong.value.songId;
                if (songId && songId !== lastRecordedSongId) {
                    lastRecordedSongId = songId;
                    axios.post('/api/history/add', { userId: 1, songId: songId })
                        .catch(err => console.error("记录播放历史失败:", err));
                }
            };
            const onPause = () => { isPlaying.value = false; };

            // 页面加载时请求歌单
            onMounted(() => {
                axios.get('/api/playlist/1')
                    .then(res => {
                        songList.value = res.data;
                        if (songList.value.length > 0) {
                            currentSong.value = songList.value[0];
                            fetchComments(currentSong.value.songId);
                        }
                    })
                    .catch(err => {
                        console.error("请求后端失败:", err);
                        alert("获取数据失败，请检查后端是否启动以及数据库配置！");
                    });
            });

            // 点击某首歌播放
            const playSong = (song) => {
                currentSong.value = song;
                fetchComments(song.songId);
                nextTick(() => {
                    const audio = audioPlayer.value;
                    audio.src = song.audioUrl;
                    audio.currentTime = 0;
                    audio.play().catch(e => console.log("播放被拦截或链接失效", e));
                });
            };

            // 自动下一首
            const nextSong = () => {
                if (songList.value.length > 0) {
                    let currentIndex = songList.value.findIndex(s => s.songId === currentSong.value.songId);
                    let nextIndex = (currentIndex + 1) % songList.value.length;
                    playSong(songList.value[nextIndex]);
                }
            };

            return {
                songList, currentSong, isPlaying, audioPlayer,
                currentTime, duration,
                comments, newComment, fetchComments, submitComment,
                formatTime, togglePlay, seek,
                onTimeUpdate, onLoadedMetadata, onPlay, onPause,
                playSong, nextSong, addFavorite
            };
        }
    }).mount('#app');
</script>
</body>
</html>
